name: Keep Render instance awake

# Render's free tier spins a web service down after ~15 minutes with no incoming HTTP
# traffic. For this app that's not just slower cold starts — it means the background
# trading scan loops (breakout every 5min, mean-reversion every 15min, DCA hourly) stop
# running entirely until something wakes it back up. This pings /health every 10
# minutes, comfortably inside that window, to keep it alive continuously.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf https://free-money-eu.onrender.com/health || exit 1
